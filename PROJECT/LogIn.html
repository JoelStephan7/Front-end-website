<!DOCTYPE html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="device-width, initial-scale=1.0">
    <title>Log In</title>
    
    <!--Font Awesome CDN-->
    <script src="https://kit.fontawesome.com/8533c91442.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="Styles/logstyles.css">

</head>
<body>
    <div class="formBox">
        <div class="formContainer">
            <div class="topHeader">
                <h1>Log In</h1>
            </div>
            <!--Log In form-->
            <form action="">
                <input type="text" class="inputText" placeholder="Username..." required>
                <i class="fa-solid fa-user"></i><br>
                <input type="password" class="inputText" placeholder="Password..." required>
                <i class="fa-solid fa-key"></i><br>
                <input type="submit" id="submitButton" value="Log In">
            </form><br>
            <p>No Account? <a href="#Register">Register Now!</a></p>
            <a id="forgotPW" href="#ResetPassword">Forgot Password?</a>
        </div>
    </div>
</body>
